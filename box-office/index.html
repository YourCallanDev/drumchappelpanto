<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DAPC | Box Office</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <div class="logo"><h1>DAPC</h1></div>
  <nav>
    <ul>
      <li><a href="/home">Home</a></li>
      <li><a href="/box-office" class="active">Box Office</a></li>
      <li><a href="/contact">Contact</a></li>
    </ul>
  </nav>
</header>

<main class="main-container">
  <section class="center">
    <h2>Book Your Tickets 🎟️</h2>
    <p>Join us for our next magical production!</p>
  </section>

  <div class="grid-2">
    <div class="event-card center">
      <img src="../assets/wizard.png" alt="The Wizard of Oz" style="width:100%; border-radius:10px;">
      <h3>The Wizard of Oz</h3>
      <p>Nov 21st & 22nd, 2026</p>
      <a href="https://www.ticketsource.co.uk/drumchapelpantomimegroup" class="cta-button" target="_blank">Book Now</a>
    </div>

    <div class="event-card center">
      <img src="../assets/sinderella.png" alt="Sinderella" style="width:100%; border-radius:10px;">
      <h3>Sinderella (18+)</h3>
      <p>Dates TBC</p>
      <button class="cta-button" disabled>Coming Soon</button>
    </div>
  </div>

  <div class="ticket-wrapper" style="margin-top:40px;">
    <iframe src="https://www.ticketsource.co.uk/drumchapelpantomimegroup" style="width:100%; height:600px; border:none; border-radius:15px;"></iframe>
  </div>
</main>

<footer>© 2026 Drumchapel Amateur Pantomime Club</footer>
<script src="../script.js"></script>
</body>
</html>
